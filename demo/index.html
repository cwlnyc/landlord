<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Try the landlord repair and rent text line: you're the landlord, and the tenant and plumber are played for you.">
<title>Landlord Line demo</title>
<style>
  :root { --bg:#f4f1ec; --fg:#1d1b18; --muted:#6b665e; --line:#e3ded5; --me:#2f6fde; --them:#e9e7e3; --card:#fff; --accent:#d97757; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141311; --fg:#ece9e4; --muted:#9a948a; --line:#2c2a27; --me:#3b7af0; --them:#2a2826; --card:#1d1c19; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.4 -apple-system,system-ui,sans-serif; }
  .app { display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; }
  header { padding:12px 16px 10px; border-bottom:1px solid var(--line); }
  header b { display:block; font-size:17px; }
  header small { color:var(--muted); display:block; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .tools button, .chips button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:16px; padding:5px 12px; }
  #thread { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:82%; padding:8px 12px; border-radius:18px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .in { align-self:flex-start; background:var(--them); }
  .out { align-self:flex-end; background:var(--me); color:#fff; }
  .msg time { display:block; font-size:11px; opacity:.6; margin-top:2px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 12px 8px; }
  .chips button { border-color:var(--me); color:var(--me); font-size:16px; padding:7px 14px; }
  form { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  input { flex:1; min-width:0; font:inherit; font-size:17px; padding:10px 14px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  form button { font:inherit; font-weight:600; border:0; border-radius:20px; padding:0 16px; background:var(--accent); color:#fff; }
  .hint { margin:auto; color:var(--muted); text-align:center; font-size:15px; }
  details { padding:0 12px 8px; color:var(--muted); font-size:14px; }
  details p { margin:6px 0; }
  details b { color:var(--fg); }
</style>
</head>
<body>
<div class="app">
  <header>
    <b>Landlord Line: demo</b>
    <small>You're Pat, the landlord. Tap a tenant below to have them text in; they and the plumber are played for you. Reply like you'd text anyone.</small>
    <div class="tools">
      <button id="water" type="button">Maria: water's out</button>
      <button id="door" type="button">Kevin: door won't close</button>
      <button id="rent" type="button">Kevin: paid rent</button>
      <button id="restart" type="button">Start over</button>
    </div>
  </header>
  <div id="thread"></div>
  <div class="chips" id="chips"></div>
  <details><summary>Behind the scenes: what the tenant and plumber get</summary><div id="others"></div></details>
  <form id="send"><input id="input" placeholder="Text message" autocomplete="off" enterkeyhint="send"><button>Send</button></form>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
